<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="VEMO terminal demo">
  <rect width="760" height="320" rx="12" fill="#0f1b22"/>
  <rect width="760" height="36" rx="12" fill="#16262e"/>
  <rect y="20" width="760" height="16" fill="#16262e"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" font-size="12" fill="#7d8da1">vemo — governance that fires</text>
  <g font-size="14.5">
    <text x="22" y="68" fill="#5eead4">$ vemo eval</text>
    <text x="22" y="92" fill="#94a3b8">  [<tspan fill="#7ee787">PASS</tspan>] scope · tier · exec-evidence · capability-monotonic · safety-invariant …</text>
    <text x="22" y="116" fill="#e6edf3">  [eval] conformance <tspan fill="#7ee787" font-weight="bold">9/9 = 100%</tspan>  → eval/out/report.json</text>
    <text x="22" y="150" fill="#5eead4">$ <tspan fill="#94a3b8">#agent tries to edit a file outside its task's scope…</tspan></text>
    <text x="22" y="174" fill="#e6edf3">  edit src/auth/login.ts</text>
    <text x="22" y="198" fill="#fca5a5">  [VEMO] BLOCKED (safety.spec#1): outside scope_in  → exit 2</text>
    <text x="22" y="232" fill="#5eead4">$ vemo status</text>
    <text x="22" y="256" fill="#e6edf3">  tier=<tspan fill="#f0c674">high</tspan>  enforcement=<tspan fill="#7ee787">enforce</tspan>  run-budget 0/300  auto=off</text>
    <text x="22" y="280" fill="#94a3b8">  tip: stronger model? bump capability.tier — verification tightens, prescription shrinks</text>
    <text x="22" y="304" fill="#5eead4">$ <tspan fill="#e6edf3">▋</tspan></text>
  </g>
</svg>
