<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="VEMO architecture">
  <rect width="760" height="392" rx="16" fill="#f7f8fa"/>
  <text x="32" y="40" font-size="20" font-weight="800" fill="#16202b">VEMO architecture</text>
  <text x="32" y="60" font-size="12.5" fill="#6b7280">lower = more enforced mechanism · upper = advisory prose</text>
  <!-- enforced→advised rail -->
  <defs><linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs>
  <rect x="32" y="80" width="8" height="284" rx="4" fill="url(#rail)"/>
  <text x="20" y="84" font-size="9.5" font-weight="700" fill="#16a34a" transform="rotate(0)">advice</text>
  <text x="20" y="362" font-size="9.5" font-weight="700" fill="#dc2626">force</text>
  <!-- layers -->
  <g font-size="13">
    <g><rect x="56" y="78" width="672" height="48" rx="10" fill="#fff" stroke="#c7d2fe"/>
      <rect x="56" y="78" width="120" height="48" rx="10" fill="#4f46e5"/>
      <text x="116" y="107" text-anchor="middle" fill="#fff" font-weight="800">AGENTS.md</text>
      <text x="190" y="100" fill="#16202b" font-weight="700">Entry · thin router</text>
      <text x="190" y="117" fill="#6b7280" font-size="11.5">loads config + safety, JIT-loads the rest</text></g>
    <g><rect x="56" y="134" width="672" height="48" rx="10" fill="#fff" stroke="#fcd9a8"/>
      <rect x="56" y="134" width="120" height="48" rx="10" fill="#d97706"/>
      <text x="116" y="163" text-anchor="middle" fill="#fff" font-weight="800">config</text>
      <text x="190" y="156" fill="#16202b" font-weight="700">vemo.config.yaml</text>
      <text x="190" y="173" fill="#6b7280" font-size="11.5">tier · routing · risk_tiers · run_budget · enforcement</text></g>
    <g><rect x="56" y="190" width="672" height="48" rx="10" fill="#fff" stroke="#ddd0f6"/>
      <rect x="56" y="190" width="120" height="48" rx="10" fill="#7c3aed"/>
      <text x="116" y="219" text-anchor="middle" fill="#fff" font-weight="800">specs/</text>
      <text x="190" y="212" fill="#16202b" font-weight="700">JIT-loaded governance</text>
      <text x="190" y="229" fill="#6b7280" font-size="11.5">safety · task · verify · capability · concurrency · coding · automation</text></g>
    <g><rect x="56" y="246" width="672" height="48" rx="10" fill="#fff5f5" stroke="#ef4444" stroke-width="2"/>
      <rect x="56" y="246" width="120" height="48" rx="10" fill="#dc2626"/>
      <text x="116" y="275" text-anchor="middle" fill="#fff" font-weight="800">enforce/</text>
      <text x="190" y="268" fill="#b91c1c" font-weight="800">MECHANISM ◀ the layer others lack</text>
      <text x="190" y="285" fill="#6b7280" font-size="11.5">hooks (client) + CI pre-commit (authority) + validator</text></g>
    <g><rect x="56" y="302" width="672" height="48" rx="10" fill="#fff" stroke="#bae6fd"/>
      <rect x="56" y="302" width="120" height="48" rx="10" fill="#0284c7"/>
      <text x="116" y="331" text-anchor="middle" fill="#fff" font-weight="800">verify</text>
      <text x="190" y="324" fill="#16202b" font-weight="700">agents/ · eval/ · bin/vemo</text>
      <text x="190" y="341" fill="#6b7280" font-size="11.5">independent judge · executable conformance (9/9) · CLI</text></g>
  </g>
</svg>
