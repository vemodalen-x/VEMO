name: vemo
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      VEMO_APPROVED_TASK: ${{ vars.VEMO_APPROVED_TASK }}
      VEMO_APPROVED_TASK_DIGEST: ${{ vars.VEMO_APPROVED_TASK_DIGEST }}
      VEMO_APPROVED_BY: ${{ vars.VEMO_APPROVED_BY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve change range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "VEMO_DIFF_RANGE=${{ github.event.pull_request.base.sha }}...HEAD" >> "$GITHUB_ENV"
            echo "VEMO_TRUSTED_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000)
                BEFORE="$(git hash-object -t tree /dev/null)"
                TRUSTED_REF=""
                ;;
              *) TRUSTED_REF="$BEFORE" ;;
            esac
            echo "VEMO_DIFF_RANGE=$BEFORE..HEAD" >> "$GITHUB_ENV"
            echo "VEMO_TRUSTED_REF=$TRUSTED_REF" >> "$GITHUB_ENV"
          fi
      - name: Preflight with trusted base evaluator
        shell: bash
        run: |
          [ -n "$VEMO_TRUSTED_REF" ] || { echo "VEMO 2.0 bootstrap requires protected manual approval" >&2; exit 2; }
          git show "$VEMO_TRUSTED_REF:enforcement/core.py" > "$RUNNER_TEMP/vemo-trusted-core.py" || {
            echo "trusted base has no VEMO 2.0 evaluator; use the protected bootstrap process" >&2
            exit 2
          }
          python3 - "$RUNNER_TEMP/vemo-trusted-core.py" <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location("vemo_trusted_core", sys.argv[1])
          core = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(core)
          result = core.check_merge(Path(os.environ["GITHUB_WORKSPACE"]), os.environ["VEMO_DIFF_RANGE"], False)
          print(json.dumps(result, indent=2))
          raise SystemExit(0 if result["decision"] == "allow" else 2)
          PY
      - name: Validate candidate contract
        run: python3 bin/vemo check --self
      - name: Execute verification
        run: python3 bin/vemo verify --range "$VEMO_DIFF_RANGE"
      - name: Decide merge
        run: python3 bin/vemo check --range "$VEMO_DIFF_RANGE"
